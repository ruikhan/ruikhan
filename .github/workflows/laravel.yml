name: Laravel Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Setup PHP 8.2 (Safest for Laravel 9)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.2"
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
        coverage: none

    # 2. Setup Node.js (For Vite)
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # 3. Install Composer Dependencies
    # ADDED: --no-audit (This forces it to ignore the security warning)
    - name: Install Composer Dependencies
      run: composer update --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-audit

    - name: Install NPM & Build Vite
      run: |
        npm install
        npm run build

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
