name: Laravel CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Setup PHP 8.2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3. Copy .env file
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # --- REMOVED THE FAULTY "DISABLE SECURITY BLOCKING" STEP HERE ---

      # 4. Install Dependencies (Composer)
      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

      # 5. Install NPM & Build Vite Assets
      - name: Install NPM & Build Vite
        run: |
          npm install
          npm run build

      # 6. Generate key & Set Permissions
      - name: Configure Application
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      # 7. Create SQLite Test Database
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      # 8. Execute Tests
      - name: Execute tests (Unit and Feature tests)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test