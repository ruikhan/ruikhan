name: Laravel Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - uses: actions/checkout@v4

    # 2. Setup PHP with 8.2 and required extensions
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
        coverage: none

    # 3. Create the Environment File
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # 4. Install Dependencies (Using 'update' to fix lock file mismatch)
    - name: Install Dependencies
      run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # 5. Generate the App Key
    - name: Generate key
      run: php artisan key:generate

    # 6. Fix Permissions
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # 7. Create a blank SQLite database
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    # 8. Run the Tests (Forcing SQLite connection)
    - name: Execute tests (Unit and Feature) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test